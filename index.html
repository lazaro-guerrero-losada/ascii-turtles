<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii sea turtles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <canvas id="canvas" aria-hidden="true"></canvas>

    <!-- Standalone zero-dependency bundle: runs in any browser without build tools -->
    <script src="./turtles.js"></script>
    <script>
      if (typeof TurtleEngine !== "undefined" && !window.__TURTLE_DEMO__) {
        window.__TURTLE_DEMO__ = true;
        const kinds = new URLSearchParams(location.search).get("turtles")?.split(",").filter(Boolean);
        const turtles = kinds ? kinds.map((kind, i) => ({ kind, size: 1 - i * 0.1 })) : undefined;
        new TurtleEngine(document.querySelector("canvas"), turtles);
      }
    </script>

    <!-- Vite dev server entry point -->
    <script type="module" src="/demo.ts"></script>
  </body>
</html>
